name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Capture Splat replay dependency
        uses: actions/checkout@v7
        with:
          repository: sandeep-devarapalli/capture-splat
          ref: afda43a4513948d7381cd35cb74d225e4807d481
          path: .ci/capture-splat

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Capture Splat replay dependency
        run: python -m pip install --disable-pip-version-check -e .ci/capture-splat

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Live session end-to-end
        env:
          CAPTURE_SPLAT_REPO: ${{ github.workspace }}/.ci/capture-splat
        run: pnpm test:live-e2e

      - name: World compiler blueprint validation
        run: pnpm validate:blueprint

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: UI smoke tests
        run: pnpm test:ui

  desktop-package-smoke:
    name: Packaged desktop smoke
    runs-on: macos-latest
    env:
      WORLD_STUDIO_DESKTOP_SMOKE_ARTIFACTS: ${{ github.workspace }}/desktop-smoke-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package and smoke test desktop app
        run: pnpm desktop:package:smoke

      - name: Upload packaged desktop smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-desktop-smoke-screenshots
          path: ${{ env.WORLD_STUDIO_DESKTOP_SMOKE_ARTIFACTS }}
          if-no-files-found: warn
          retention-days: 14
